[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-ripe-sync"
version = "1.0.0"
description = "NetBox plugin to synchronise inetnum/inet6num objects to the RIPE Database"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: Django",
    "Topic :: Internet",
]
dependencies = [
    "requests>=2.28",
    "iso3166>=2.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.24"]

[tool.setuptools.packages.find]
include = ["netbox_ripe_sync*"]

[tool.setuptools.package-data]
netbox_ripe_sync = ["templates/**/*.html"]
