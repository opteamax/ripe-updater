[metadata]
name = netbox-ripe-sync
version = 1.0.0
description = NetBox plugin to synchronise inetnum/inet6num objects to the RIPE Database
long_description = file: README.md
long_description_content_type = text/markdown
author = NetBox RIPE Sync
license = Apache-2.0
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: Apache Software License
    Framework :: Django
    Topic :: Internet

[options]
packages = find:
python_requires = >=3.10
install_requires =
    requests>=2.28
    iso3166>=2.0
    boto3>=1.24 ; extra == "s3"

[options.extras_require]
s3 =
    boto3>=1.24

[options.package_data]
netbox_ripe_sync =
    templates/**/*.html
    templates/**/**/*.html
